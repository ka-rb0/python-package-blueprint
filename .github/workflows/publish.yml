# Publishes a tagged release to PyPI via Trusted Publishing (OIDC) - no API
# token stored or rotated. Only fires when a GitHub Release is published
# (hatch-vcs derives the version from the tag the release points at - see
# [tool.hatch.version] in pyproject.toml), and only runs against the
# `production` environment, so an OIDC token is only ever minted for a run
# that environment's protection rules (repo Settings -> Environments) have
# allowed through - not merely to anyone with push access to this repo.
#
# Registered as a Trusted Publisher on PyPI against:
#   owner: ka-rb0, repository: python-package-blueprint,
#   workflow: publish.yml, environment: production
# Changing this filename or the environment name below needs a matching
# update on PyPI's "Manage" -> "Publishing" page for the project, or
# publishing will fail with a Trusted Publisher mismatch.
#
# No lint/test/build gate in this workflow itself - by design it relies on
# ci.yml already having passed on the commit a release tag points at (branch
# protection on main should enforce that). It does still build fresh
# sdist/wheel here rather than reusing ci.yml's, so what gets uploaded is
# built from exactly the tagged commit.
#
# Same pinning rules as ci.yml: actions pinned to commit SHAs, kept current
# by Dependabot (.github/dependabot.yml).
name: Publish

on:
  release:
    types: [published]

# A publish should never be interrupted mid-upload.
concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: read
  # Exchanged for a short-lived PyPI upload credential via Trusted
  # Publishing, and used to sign the PEP 740 attestations - see the publish
  # step below.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://pypi.org/project/python-package-blueprint/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: pyproject.toml
      # No enable-cache here (unlike ci.yml/audit.yml): this run ends in a
      # real PyPI publish with id-token:write, so it deliberately skips the
      # shared actions cache to avoid a cache-poisoning risk (a lower-
      # privileged run poisoning the cache, this one consuming it) - flagged
      # by zizmor. One run per release; the speed cost isn't worth it here.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Build sdist and wheel
        run: uv build
      # Upload via PyPA's action rather than `uv publish`: it also generates
      # and uploads PEP 740 digital attestations (`attestations: true`, the
      # default - spelled out here because it's the reason this step isn't
      # `uv publish`, which can't produce them). Each artifact in dist/ gets
      # a Sigstore-signed statement binding it to this workflow's identity,
      # which PyPI verifies on upload and then shows on the release page, so
      # consumers can check that a file really came from this repo's
      # publish.yml. Needs the id-token: write granted above.
      #
      # No `password` input, so the action uses Trusted Publishing (OIDC) -
      # same credential path as before. It fails loudly if the exchange
      # isn't available rather than falling back to an (absent) token,
      # matching what `--trusted-publishing always` gave us.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          print-hash: true
